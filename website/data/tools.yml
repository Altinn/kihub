# yaml-language-server: $schema=../../.schemas/tools.schema.json
# Tools data for the DigDir KI HUB website
# Each tool entry provides information for the tools page

tools:
  - id: mcp-server
    name: DigDir KI HUB MCP Server
    description: >-
      A Model Context Protocol (MCP) Server that provides prompts for searching and installing
      prompts, instructions, agents, and skills directly from this repository. Makes it easy
      to discover and add customizations to your editor.
    category: MCP Servers
    featured: true
    requirements:
      - Docker installed and running
    links:
      blog: https://developer.microsoft.com/blog/announcing-kihub-mcp-server
      vscode: https://aka.ms/kihub/mcp/vscode
      vscode-insiders: https://aka.ms/kihub/mcp/vscode-insiders
      visual-studio: https://aka.ms/kihub/mcp/vs
    configuration:
      type: json
      content: |
        {
          "servers": {
            "kihub": {
              "type": "stdio",
              "command": "docker",
              "args": [
                "run",
                "-i",
                "--rm",
                "ghcr.io/microsoft/mcp-dotnet-samples/kihub:latest"
              ]
            }
          }
        }
    tags:
      - mcp
      - docker
      - search
      - install

  - id: digdir-norwegian-law-mcp
    name: Digdir Norwegian Law MCP
    description: >-
      A read-only Model Context Protocol (MCP) server for searching and citing current
      Norwegian laws and central regulations from Lovdata publicData. The hosted MVP exposes
      legal lookup tools through a streamable HTTP endpoint.
    category: MCP Servers
    requirements:
      - MCP client with streamable HTTP support
    features:
      - Search current Norwegian laws and central regulations
      - Retrieve documents and individual provisions
      - Validate and format supported Norwegian legal citations
      - Check whether documents and provisions exist in the current corpus
    links:
      documentation: https://github.com/adidahl/digdir-lovdata-mcp#readme
      github: https://github.com/adidahl/digdir-lovdata-mcp
    configuration:
      type: json
      content: |
        {
          "servers": {
            "digdir-norwegian-law": {
              "type": "http",
              "url": "https://digdir-lovdata-d3ojbxudz-hiadidahl-3925s-projects.vercel.app/api/mcp"
            }
          }
        }
    tags:
      - mcp
      - http
      - legal
      - lovdata
      - norway

  - id: digdir-local-transcriber
    name: Digdir Local Transcriber
    description: >-
      Offline-first Electron desktop app for Norwegian Bokmål support and customer-service calls.
      It records microphone and system/window audio, transcribes locally with whisper.cpp, cleans
      noisy ASR output, infers caller and agent roles, summarizes locally with llama.cpp, stores
      case history, and exports JSON. It can run fully offline after models and helpers are
      downloaded; OpenAI mode is optional.
    category: Desktop Apps
    version: "v0.1.0"
    type: desktop-app
    license: Not specified
    platforms:
      - macos-arm64
      - macos-x64
      - windows-x64
      - linux-x64
    requirements:
      - Microphone permission
      - Screen/window capture permission for system or window audio
      - First local setup downloads whisper.cpp, llama.cpp, Whisper model files, and GGUF summarization models
    features:
      - Desktop app for macOS, Windows, and Linux
      - Records microphone and system/window audio
      - Local transcription through whisper.cpp
      - Local summarization through llama.cpp
      - Optional OpenAI online mode
      - Norwegian Bokmål prompt tuning
      - Case history with editable case titles
      - JSON export
      - Model manager for Whisper and LLM downloads
      - Progress UI for local LLM processing
      - Privacy-friendly offline-first workflow
    links:
      release: https://github.com/adidahl/digdir-local-transcriber/releases/tag/v0.1.0
      github: https://github.com/adidahl/digdir-local-transcriber
    downloads:
      - label: macOS Apple Silicon
        platform: macos-arm64
        url: https://github.com/adidahl/digdir-local-transcriber/releases/download/v0.1.0/Digdir-Local-Transcriber-0.1.0-mac-arm64.dmg
      - label: macOS Intel
        platform: macos-x64
        url: https://github.com/adidahl/digdir-local-transcriber/releases/download/v0.1.0/Digdir-Local-Transcriber-0.1.0-mac-x64.dmg
      - label: Windows x64
        platform: windows-x64
        url: https://github.com/adidahl/digdir-local-transcriber/releases/download/v0.1.0/Digdir-Local-Transcriber-0.1.0-windows-x64.exe
      - label: Linux AppImage
        platform: linux-appimage-x64
        url: https://github.com/adidahl/digdir-local-transcriber/releases/download/v0.1.0/Digdir-Local-Transcriber-0.1.0-linux-x86_64.AppImage
      - label: Linux DEB
        platform: linux-deb-x64
        url: https://github.com/adidahl/digdir-local-transcriber/releases/download/v0.1.0/Digdir-Local-Transcriber-0.1.0-linux-amd64.deb
    privacy: Audio and transcripts stay local unless the user enables online OpenAI mode.
    warnings:
      - Builds are currently unsigned/not notarized, so macOS and Windows may show operating-system security warnings.
      - Models are not bundled in the installer.
      - No custom app icon yet; current builds use the default Electron icon.
      - License is not currently specified in the repository.
    tags:
      - offline
      - whisper-cpp
      - llama-cpp
      - norwegian
      - electron
      - desktop
      - asr
      - summarization
      - audio
      - transcription
      - local-ai
      - productivity
