# yaml-language-server: $schema=../../.schemas/tools.schema.json
# Tools data for the DigDir KI HUB website
# Each tool entry provides information for the tools page

tools:
  - id: mcp-server
    name: DigDir KI HUB MCP Server
    description: >-
      A Model Context Protocol (MCP) Server that provides prompts for searching and installing
      prompts, instructions, agents, and skills directly from this repository. Makes it easy
      to discover and add customizations to your editor.
    category: MCP Servers
    featured: true
    requirements:
      - Docker installed and running
    links:
      blog: https://developer.microsoft.com/blog/announcing-kihub-mcp-server
      vscode: https://aka.ms/kihub/mcp/vscode
      vscode-insiders: https://aka.ms/kihub/mcp/vscode-insiders
      visual-studio: https://aka.ms/kihub/mcp/vs
    configuration:
      type: json
      content: |
        {
          "servers": {
            "kihub": {
              "type": "stdio",
              "command": "docker",
              "args": [
                "run",
                "-i",
                "--rm",
                "ghcr.io/microsoft/mcp-dotnet-samples/kihub:latest"
              ]
            }
          }
        }
    tags:
      - mcp
      - docker
      - search
      - install

  - id: digdir-norwegian-law-mcp
    name: Digdir Norwegian Law MCP
    description: >-
      A read-only Model Context Protocol (MCP) server for searching and citing current
      Norwegian laws and central regulations from Lovdata publicData. The hosted MVP exposes
      legal lookup tools through a streamable HTTP endpoint.
    category: MCP Servers
    requirements:
      - MCP client with streamable HTTP support
    features:
      - Search current Norwegian laws and central regulations
      - Retrieve documents and individual provisions
      - Validate and format supported Norwegian legal citations
      - Check whether documents and provisions exist in the current corpus
    links:
      documentation: https://github.com/adidahl/digdir-lovdata-mcp#readme
      github: https://github.com/adidahl/digdir-lovdata-mcp
    configuration:
      type: json
      content: |
        {
          "servers": {
            "digdir-norwegian-law": {
              "type": "http",
              "url": "https://digdir-lovdata-d3ojbxudz-hiadidahl-3925s-projects.vercel.app/api/mcp"
            }
          }
        }
    tags:
      - mcp
      - http
      - legal
      - lovdata
      - norway
